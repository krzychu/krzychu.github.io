<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css">
    <script src="countdown.js"></script>
</head>

<body>
    <h1>Countdown</h1>
    
    <p>
        <a href="index.html">⏎ kchrobak.pl</a>
    </p>

    <h2>Quarter</h2>
    <ul id="quarter">
        <li class="start"></li>
        <li class="end"></li>
        <li class="weeks"></li>
        <li class="fraction"></li>
    </ul>

    <h2>Semester</h2>
    <ul id="semester">
        <li class="start"></li>
        <li class="end"></li>
        <li class="weeks"></li>
        <li class="fraction"></li>
    </ul>

    <h2>Half-Year</h2>
    <ul id="half-year">
        <li class="start"></li>
        <li class="end"></li>
        <li class="weeks"></li>
        <li class="fraction"></li>
    </ul>

    <h2>Year</h2>
    <ul id="year">
        <li class="start"></li>
        <li class="end"></li>
        <li class="weeks"></li>
        <li class="fraction"></li>
    </ul>
</body>

</html>
